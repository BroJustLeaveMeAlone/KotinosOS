# Disk layout for the OS image.
#
# Uses customizations.disk rather than customizations.filesystem: only the
# disk path supports build-time btrfs subvolume creation. The filesystem
# path silently limits you to / and /boot on a btrfs root.
#
# The ESP, BIOS boot partition and /boot are generated automatically and
# must not be declared here.
#
# Subvolumes use the @ prefix convention (openSUSE/Ubuntu) because snapper
# and grub-btrfs tooling assumes it.
#
# There is deliberately no @home subvolume. Fedora bootc makes /home a
# symlink to /var/home (and /root a symlink to /var/roothome), so a
# subvolume mounted at /home is never used -- verified on a running system,
# where @home existed but was mounted nowhere. All user data lives under
# /var, which @var covers.

[[customizations.disk.partitions]]
type = "btrfs"
minsize = "20 GiB"

[[customizations.disk.partitions.subvolumes]]
name = "@"
mountpoint = "/"

# The user-data volume: /var holds /var/home, /var/roothome, logs and app
# state. This is what snapper snapshots for the data safety net (M2).
#
# Note: when /var is its own subvolume, bootc does NOT copy the image's /var
# into it -- systemd-tmpfiles creates a bare skeleton instead. Anything baked
# into the image under /var (user homes, SSH keys) is silently discarded, so
# users must be provisioned at first boot, not at build time.
[[customizations.disk.partitions.subvolumes]]
name = "@var"
mountpoint = "/var"

# The vault: a protected copy of the irreplaceable files.
#
# A SEPARATE PARTITION, not a subvolume, and one that stays unmounted.
#
# Both choices are the feature rather than implementation detail. Snapshots live
# inside the same filesystem as the data they protect, so `btrfs subvolume
# delete`, or ransomware running as the user, destroys both at once. A partition
# that is not attached to the running system cannot be encrypted, deleted or
# corrupted -- the vault service mounts it, writes, and unmounts, so the window
# in which anything can reach it is seconds a day.
#
# The mountpoint below is declared only because the image builder rejects a
# partition without one ("invalid partitioning customizations: mountpoint is
# empty"). It is never used: the Containerfile masks the generated
# `vault.mount` unit so the partition is not mounted at boot, and the vault
# service mounts it by label at /run/kotinos-vault when it needs to. The
# declared path exists to satisfy the schema, nothing more.
#
# ext4 rather than btrfs: the vault wants boring and robust, not clever. It
# needs no snapshots of its own -- it keeps versions by hardlinking unchanged
# files between them -- and ext4 has no copy-on-write fragmentation to manage.
#
# Size: this is a FIXED 8 GiB floor, not a percentage.
#
# "Roughly a tenth of the disk, capped" is the intended rule, but it cannot live
# here: a disk *image* is a fixed-size artifact with no knowledge of the target
# machine's drive, so a percentage is meaningless at build time. That rule is
# computed by the installer (M7), which sees the real disk:
#
#     vault_size = min(cap, max(8 GiB floor, 10% of target disk))
#
# 8 GiB is the correct value here regardless -- it is the minimum a vault should
# ever be, and it is what direct-image installs (dd to a disk, or a VM) get. The
# floor also sets the smallest disk KotinosOS supports.
#
# Documents and settings are small, and hardlinking unchanged files between
# versions means several full versions cost barely more than one, so even 8 GiB
# holds a lot of history.
[[customizations.disk.partitions]]
type = "plain"
label = "kotinos-vault"
fs_type = "ext4"
mountpoint = "/vault"
minsize = "8 GiB"
