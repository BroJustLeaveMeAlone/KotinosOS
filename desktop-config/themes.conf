# KotinosOS theme presets.
#
# The restriction principle applied to aesthetics: a short list of choices that
# all look considered, rather than a colour picker and a hundred sliders that
# let anyone build something ugly and then blame the machine for it.
#
# Each preset is a complete look -- accent, colour scheme and wallpaper together
# -- because those three fight each other when set independently. A teal accent
# on an ember wallpaper is not a preference, it is a mistake nobody chose.
#
# Format: name|label|accent|scheme|wallpaper
#   scheme:    light | dark | auto  (auto follows sunrise and sunset)
#   wallpaper: a name from /usr/share/kotinos/wallpapers, or "time" to follow
#              the clock

# The default. Brand teal, following the light in the room.
kotinos|Kotinos|#0f766e|auto|time

# For people who want the desktop to disappear behind their work.
graphite|Graphite|#4b5563|dark|night

# Bright and neutral, for well-lit rooms and shared screens.
linen|Linen|#0d9488|light|day

# Warm, low-contrast, easier late at night than a blue-white desktop.
ember|Ember|#b45309|dark|dusk

# High contrast, for legibility rather than taste. Kept deliberately plain --
# an accessibility option that looks like a compromise will not get chosen by
# the people who need it.
clarity|Clarity|#0369a1|light|day
