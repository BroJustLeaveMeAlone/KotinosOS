# Vault settings.
#
# Everything here is editable in admin mode. Settings are grouped by how much
# damage getting them wrong can do, because "you can change this" and "you
# should change this" are not the same statement and the difference matters
# when the thing being configured is a backup.
#
# The vault is a protected copy of your irreplaceable files, kept on a separate
# area that is disconnected from the running system except while being written.

# ============================================================================
# SAFE TO CHANGE — behaviour only, nothing at risk
# ============================================================================

# Also keep a copy on an external disk, when one is connected.
#
# Asked at first boot. The same-disk vault survives deleting your files,
# ransomware, and a botched admin session -- but not the drive itself failing,
# because it is on that drive. An external copy is the only thing that survives
# hardware death, theft or fire.
#
# When on: any disk labelled kotinos-vault-external is mirrored to
# automatically whenever it is plugged in. Nothing to remember, nothing to run.
MIRROR_EXTERNAL=no

# How many previous versions to keep of each file.
#
# Cheap to raise: unchanged files are hardlinked between versions, so a second
# version of a document you did not edit costs one directory entry, not another
# copy. Ten versions of a mostly-static home directory costs barely more than
# one.
KEEP_VERSIONS=5

# What gets protected.
#
# The rule is small and irreplaceable, not large and reproducible. A photo
# library you also have on your phone is replaceable; the .ssh keys and the
# thesis are not. Add anything you would be upset to lose.
#
# Note .var/app: Flatpak applications keep their settings, history and logins
# there rather than in .config. Leaving it out would restore every document and
# lose every app's state, which is the kind of gap nobody notices until the day
# it matters.
#
# Note what is NOT here: the applications themselves. Those are re-downloaded
# by id, so a record of what was installed costs kilobytes where the binaries
# would cost gigabytes -- and reinstalling gets current versions rather than
# restoring however many months of security holes were current at backup time.
# See kotinos-apps.
INCLUDE_DIRS=("Documents" "Pictures" "Desktop" ".config" ".var/app" ".local/share/keyrings" ".ssh" ".gnupg" ".mozilla" ".thunderbird" "Applications")

# What never goes in, even inside the folders above. These are large, and either
# reproducible or actively harmful to copy repeatedly (disk images change
# wholesale, so each version really is another full copy).
EXCLUDE_GLOBS=("*.iso" "*.qcow2" "*.vmdk" "*.img" "node_modules" ".cache" "Trash")

# ============================================================================
# CHANGE AT YOUR OWN RISK — can cost you the safety net
# ============================================================================

# Vault size is fixed at install, at roughly a tenth of the disk.
#
# It is NOT a setting here, and that is deliberate. The vault is a real
# partition, which is exactly what lets it stay unmounted and therefore
# untouchable. Resizing one afterwards means moving the boundary with the
# user-data volume beside it, which risks both and cannot happen while either
# is in use.
#
# The installer (M7) sizes it at min(cap, max(8 GiB, 10% of the disk)). Ten
# percent is generous rather than tight for what the vault holds: on a 512 GB
# machine it is about 50 GB, for documents and settings. Direct-image and VM
# installs get the 8 GiB floor instead, since a disk image cannot know the
# target drive's size. Either way, running out almost always means a large
# folder found its way into INCLUDE_DIRS, or too many versions are being kept,
# not that the vault is too small.
#
# So if space is short, in order:
#   1. remove large or reproducible folders from INCLUDE_DIRS  (reversible)
#   2. lower KEEP_VERSIONS                                     (reversible)
#   3. change the size from the installer, booted from install media, where
#      nothing is mounted                                      (not reversible)
#
# The vault warns in its log at 75% and again at 90%, listing the biggest
# things it is holding, so this is a decision made with numbers rather than
# after something has already failed.

# Turn the vault off entirely.
#
# Doing this leaves snapshots as the only protection. Snapshots are good, and
# they cannot be reached by `rm -rf /*` -- but they live in the same filesystem
# as your data, so `btrfs subvolume delete`, or ransomware running as you, can
# erase both at once. The vault exists precisely because that gap is real.
VAULT_ENABLED=yes
