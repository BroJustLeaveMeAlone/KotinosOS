# KotinosOS resolved hardening (M4).
#
# Closes the two multicast name-resolution listeners systemd-resolved opens by
# default. The attack-surface audit found both on a booted machine, listening on
# 0.0.0.0 rather than loopback.

[Resolve]
# LLMNR is Microsoft's link-local name resolution, and it is the reason
# systemd-resolved listens on 0.0.0.0:5355 on both TCP and UDP.
#
# It is worth switching off for a reason beyond "one less open port". LLMNR
# answers name lookups that DNS failed to resolve by shouting the name onto the
# local network and trusting whoever replies first. That is the mechanism behind
# a whole family of credential-theft tools -- an attacker on the same network
# answers "yes, that's me" to a mistyped or unqualified hostname, and collects
# the authentication attempt that follows. On a home or cafe network, which is
# exactly where this appliance lives, that is a real exposure with no
# corresponding benefit: nothing on KotinosOS needs LLMNR to find anything.
LLMNR=no

# resolved's own mDNS responder is off because Avahi is already the mDNS
# implementation on this system (it holds 5353). Two responders for one protocol
# is not redundancy, it is two things to keep configured and audit, and only one
# of them is the one the desktop actually talks to.
#
# NOTE: this does NOT disable mDNS on the machine. Avahi still provides it, and
# that is deliberate -- see the firewall block in the Containerfile for why mdns
# stays open when everything else is shut.
MulticastDNS=no
