# KotinosOS kernel hardening (M4).
#
# Conservative, desktop-safe hardening. Each line is here because it closes a
# real avenue a compromised process would use, not because a checklist listed
# it. Several overlap with the lockdown Secure Boot already forces; that is
# fine, they are idempotent.

# Hide kernel pointers from unprivileged programs. Leaked pointers are how an
# exploit finds where to aim.
kernel.kptr_restrict = 2

# Keep the kernel log out of unprivileged hands. It leaks addresses and hardware
# detail useful only to an attacker.
kernel.dmesg_restrict = 1

# Restrict ptrace so one process cannot read another's memory unless it is the
# parent. This directly blocks a common malware move: reading secrets out of a
# running browser or password manager.
kernel.yama.ptrace_scope = 1

# BPF is powerful and a recurring source of privilege-escalation bugs. Deny it
# to unprivileged users and harden the JIT against the rest.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Refuse to load a new kernel at runtime. kexec is a way to sidestep Secure Boot
# by booting an unsigned kernel from a running system.
kernel.kexec_load_disabled = 1

# Symlink and hardlink protections: stop a classic /tmp race where a program is
# tricked into following a link to a file it should not touch. Usually on by
# default; asserted here so it cannot silently regress.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# DELIBERATELY NOT SET: user.max_user_namespaces = 0
#
# Every generic hardening guide says to disable unprivileged user namespaces.
# We must not. Flatpak and bubblewrap -- the entire app-sandbox model this
# milestone is built on -- create their sandboxes using exactly that feature.
# Disabling it would "harden" the system by breaking the isolation that is the
# point of the milestone. User namespaces stay enabled, on purpose.
#
# The attack-surface audit backs this up from the other side: bwrap is not
# setuid on this image. Flatpak gets its sandbox from user namespaces instead of
# from a setuid helper, so keeping them enabled removes a setuid binary rather
# than adding risk. That is the opposite of what the checklist implies.
#
# Note the sysctl NAME above, because the obvious one is a trap. Hardening
# guides overwhelmingly cite `kernel.unprivileged_userns_clone`, which is a
# Debian/Ubuntu patch and does not exist on Fedora. Adding that line here would
# not disable anything -- it would fail as an unknown key while looking, in a
# diff and in a config file, exactly like a system where unprivileged user
# namespaces had been switched off. The knob that actually works on this base is
# `user.max_user_namespaces`, which is why it is the one named here as not set.
